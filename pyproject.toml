[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wana"
dynamic = ["version"]
description = "Deterministic contamination audits and provenance for fine-tuning datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Saulo Leite", email = "sjoldeveloper@gmail.com"}]
keywords = ["fine-tuning", "jsonl", "dataset", "sft", "contamination", "provenance"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "twine>=6", "pre-commit>=4"]

[project.scripts]
wana = "wana.cli.main:main"

[project.urls]
Homepage = "https://github.com/sauloleite/wana"
Issues = "https://github.com/sauloleite/wana/issues"

[tool.hatch.version]
path = "wana/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["wana"]

[tool.hatch.build.targets.sdist]
include = ["wana", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["wana"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["wana.domain", "wana.application"]

[tool.coverage.report]
fail_under = 90
show_missing = true
