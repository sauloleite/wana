[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wana"
dynamic = ["version"]
description = "Score, select and audit fine-tuning datasets with bundled offline model weights."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Saulo Leite", email = "sjoldeveloper@gmail.com"}]
keywords = ["fine-tuning", "jsonl", "dataset", "sft", "contamination", "provenance"]
dependencies = ["llm-smollm2==0.1.2", "llama-cpp-python>=0.3.7,<0.4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
score = ["transformers>=4.46,<6", "torch>=2.4"]
embed = ["onnxruntime>=1.20", "tokenizers>=0.20", "numpy>=1.26"]
tokens = ["tiktoken>=0.7"]
all = ["wana[score,embed,tokens]"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "twine>=6", "pre-commit>=4"]

[project.scripts]
wana = "wana.cli.main:main"

[project.urls]
Homepage = "https://github.com/sauloleite/wana"
Issues = "https://github.com/sauloleite/wana/issues"

[tool.hatch.version]
path = "wana/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["wana"]

[tool.hatch.build.targets.sdist]
include = [
  "wana", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml",
  "experiments/*.py", "experiments/README.md", "experiments/results/**/summary.json",
  "experiments/results/**/protocol.json", "experiments/results/**/contamination.json",
  "experiments/results/**/ifd.png", "experiments/results/**/ifd.svg",
  "experiments/results/benchmark/*.json", "experiments/results/benchmark/*.judgments.jsonl",
  "experiments/results/benchmark/README.md", "experiments/results/benchmark/comparisons.png",
  "experiments/results/benchmark/comparisons.svg",
  "experiments/results/scorer-audit.json",
  "experiments/results/retention-curve/*.json",
  "experiments/results/retention-curve/*.judgments.jsonl",
  "experiments/results/retention-curve/README.md",
  "experiments/results/retention-curve/curve.png",
  "experiments/results/retention-curve/curve.svg",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["wana"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["wana.domain", "wana.application"]

[tool.coverage.report]
fail_under = 90
show_missing = true
