name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy wana
      - run: pytest --cov --cov-report=term-missing
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c "import os, wana; assert os.environ['RELEASE_TAG'] == 'v' + wana.__version__"
      - name: Install and exercise wheel outside checkout
        run: |
          python -m venv /tmp/wana-smoke
          /tmp/wana-smoke/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/wana-smoke/bin/wana --version
          /tmp/wana-smoke/bin/python -c "import wana; assert wana.check_contamination([], eval_sets=[]).ok"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Publish with Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
