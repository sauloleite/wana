name: ci
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Publish the original skeleton as compatibility version 0.0.1
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    if: ${{ !inputs.bootstrap }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy wana
      - run: pytest --cov --cov-report=term-missing
  node:
    if: ${{ !inputs.bootstrap }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: node
      - run: npm test
        working-directory: node
      - run: npm pack --dry-run
        working-directory: node
  integration:
    if: ${{ !inputs.bootstrap }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,score,embed]" wyra==0.1.1
      - run: python experiments/download_smoke_models.py
      - run: pytest tests/test_optional_adapters.py tests/test_wyra.py
        env:
          WANA_TEST_TRANSFORMERS_MODEL: experiments/models/smollm2
          WANA_TEST_ONNX_MODEL: experiments/models/minilm
  build:
    needs: [test, node, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c "import os, wana; assert os.environ['RELEASE_TAG'] == 'v' + wana.__version__"
      - name: Install and exercise wheel outside checkout
        run: |
          python -m venv /tmp/wana-smoke
          /tmp/wana-smoke/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/wana-smoke/bin/wana --version
          /tmp/wana-smoke/bin/python -c "import wana; assert wana.check_contamination([], eval_sets=[]).ok"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' && !inputs.bootstrap
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-publish
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Publish with Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: true
  bootstrap_build:
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1f158af6b438f031fc933b12ae0583729f5f3dae
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Version the original skeleton explicitly
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('wana/__init__.py')
          text = p.read_text()
          assert '__version__ = "0.1.0"' in text
          p.write_text(text.replace('__version__ = "0.1.0"', '__version__ = "0.0.1"'))
          p = Path('README.md')
          p.write_text('# Compatibility bootstrap 0.0.1\n\nPublished from the original skeleton commit, after 0.1.0. Use the latest release for scoring and selection.\n\n' + p.read_text())
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify the exact phase-zero installation
        run: |
          python -m venv /tmp/wana-bootstrap
          /tmp/wana-bootstrap/bin/pip install dist/wana-0.0.1-py3-none-any.whl
          cd /tmp
          test "$(/tmp/wana-bootstrap/bin/wana --version)" = "wana 0.0.1"
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-distributions
          path: dist/
  bootstrap_publish:
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap
    needs: bootstrap_build
    runs-on: ubuntu-latest
    environment: pypi-publish
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bootstrap-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: true
